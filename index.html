<!doctype html>
<html lang="en">
  <head>
    <script>
      // Restore the deep link that public/404.html stashed in ?p=.
      (function () {
        var p = new URLSearchParams(location.search).get("p");
        if (p && p.charAt(0) === "/") {
          history.replaceState(null, "", location.pathname.replace(/\/$/, "") + p);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="StreamVault — a curated catalog of gameplay videos, on demand."
    />
    <title>StreamVault — Video on Demand</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

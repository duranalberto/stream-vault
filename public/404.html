<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // SPA fallback: send deep links (/stream-vault/video/<id>) to the app
      // shell, which restores the original path from ?p=.
      var base = "/stream-vault/";
      var path = location.pathname;
      var rest = path.indexOf(base) === 0 ? path.slice(base.length - 1) : "/";
      location.replace(base + "?p=" + encodeURIComponent(rest + location.search + location.hash));
    </script>
    <title>Redirecting…</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        background: #111;
        color: #eee;
      }
      p {
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body>
    <p>Redirecting you to <a href="/stream-vault/">/stream-vault/</a>…</p>
  </body>
</html>
